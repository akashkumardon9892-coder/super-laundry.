name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create debug.keystore
        run: |
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          keytool -genkey -v -keystore "$BUILD_DIR/debug.keystore" \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          cd "$BUILD_DIR"
          gradle assembleDebug --no-daemon --console=plain -Djava.awt.headless=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'name: Build APK

