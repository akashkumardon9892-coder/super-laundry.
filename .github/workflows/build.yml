name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} \; | head -n 1)
          cd "$BUILD_DIR"
          
          # Force headless mode to prevent KSP crash
          echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx4g" >> gradle.properties
          
          gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
