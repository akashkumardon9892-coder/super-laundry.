name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Fix gradlew Permission
      run: |
        find . -name "gradlew" -exec chmod +x {} +

    - name: Build Debug APK with headless mode
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          ./gradlew assembleDebug -Djava.awt.headless=true
        else
          echo "gradlew not found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app-debug.apk'
