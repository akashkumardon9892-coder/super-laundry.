name: Build Release APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -name "*.zip" -exec unzip -o {} \;
          # Zip के अंदर से gradlew खोजकर सारी फाइलों को रूट में शिफ्ट करें
          GRADLE_DIR=$(find . -maxdepth 3 -name "gradlew" -exec dirname {} \;)
          if [ -n "$GRADLE_DIR" ] && [ "$GRADLE_DIR" != "." ]; then
            echo "Moving files from $GRADLE_DIR to root"
            cp -rn $GRADLE_DIR/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
