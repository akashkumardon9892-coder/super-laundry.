name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o '*.zip' -d extracted_project
            shopt -s dotglob
            mv extracted_project/* .
            rm -rf extracted_project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle assembleDebug -x validateSigningDebug --no-daemon --console=plain -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Djava.awt.headless=true -Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
